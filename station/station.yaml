# NormaCore Station config for one ElRobot follower + its wrist camera.
# Station auto-discovers the servo bus (USB 1a86:55d3) and any external UVC camera.
drivers:
  st3215:
    enabled: true
    current-threshold: 100
    deadband: 20
  vesc-trampa:
    enabled: false
    port-baud-rate: 115200
  system-info: true
  usb-video:
    enabled: true
    # shortest side of the JPEGs the Station stores; 224 (default) is too small for detection
    resize_target: 480
    # without preferences the Station picks the lowest resolution mode (these cameras expose 420v/yuvs on macOS, no MJPEG)
    formats:
      - format: "1280x720@30fps,420v"
      - format: "640x480@30fps,420v"
      # Linux: the same cameras expose MJPG. 1280x720 first, so frames are the 853x480 the wrist camera
      # was calibrated at. A camera the Station has held before refuses it (libuvc -51) until it is
      # handed back to the kernel driver: run scripts/cameras_ready.sh before starting the Station.
      # If frames come out 640x480, that is what happened.
      - format: "1280x720@30fps,mjpg"
      - format: "640x480@30fps,mjpg"
    # keep 1 of every 2 frames (~15 fps) to limit disk churn in the frame queue
    frame-skip: 1
inference:
- queue-id: inference/normvla
  shm: /tmp/normvla
  shm-size-mb: 12
  format: normvla
  st3215-bus: auto
  update-interval: 100ms
