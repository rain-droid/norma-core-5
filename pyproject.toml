[project]
name = "elrobot-agent"
version = "0.1.0"
description = "Agent-controlled ElRobot arm: Claude Code + voice agent over NormaCore Station"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "opencv-python-headless>=4.10",
    "mcp>=1.2",
    "pyyaml>=6.0",
    "claude-agent-sdk>=0.1.0",
]

[project.optional-dependencies]
voice = [
    "mlx-whisper>=0.4",
    "kokoro-onnx>=0.4",
    "soundfile>=0.12",
]

[project.scripts]
elrobot = "elrobot.cli:main"
elrobot-mcp = "elrobot.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elrobot"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
