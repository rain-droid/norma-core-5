[project]
name = "elrobot-agent"
version = "0.1.0"
description = "Agent-controlled ElRobot arm: Claude Code + voice agent over NormaCore Station"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "opencv-python-headless>=4.10",
    "mcp>=1.2",
    "pyyaml>=6.0",
    "claude-agent-sdk>=0.1.0",
    "pin-pink>=4.0",  # inverse kinematics (Pinocchio)
    "daqp>=0.5",  # the QP solver pink calls
    "chess>=1.10",  # legal moves and game state for the chess tools (GPL-3.0)
]

[project.optional-dependencies]
voice = [
    "mlx-whisper>=0.4; sys_platform == 'darwin'",  # speech to text on Apple silicon
    "faster-whisper>=1.0; sys_platform != 'darwin'",  # speech to text everywhere else (CTranslate2, CPU or CUDA)
    "onnx-asr[hub]>=0.6; sys_platform != 'darwin'",  # NVIDIA Parakeet v3 through onnxruntime: the preferred recogniser there
    "ptts>=0.1",  # Gradium's Phonon: small on-device text to speech, the preferred local voice
    "kokoro-onnx>=0.4",
    "soundfile>=0.12",
]

[project.scripts]
elrobot = "elrobot.cli:main"
elrobot-mcp = "elrobot.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elrobot"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.dependencies]
python = "3.12.*"
pytest = "*"

[tool.pixi.pypi-dependencies]
elrobot-agent = { path = ".", editable = true, extras = ["voice"] }

[tool.pixi.tasks]
sim = "elrobot up --sim --no-voice"
up = "elrobot up"  # Station, daemon, and the chat and voice agent
up-quiet = "elrobot up --no-voice"  # without the agent: the web UI's chat box and microphone are off
test = "pytest -q"

[tool.pytest.ini_options]
testpaths = ["tests"]  # workspace/tests runs in the workspace's own interpreter: cd workspace && uv run --with pytest pytest -q tests
