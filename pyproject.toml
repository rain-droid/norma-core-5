[project]
name = "elrobot-agent"
version = "0.1.0"
description = "Agent-controlled ElRobot arm: Claude Code + voice agent over NormaCore Station"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "opencv-python-headless>=4.10",
    "mcp>=1.2",
    "pyyaml>=6.0",
    "claude-agent-sdk>=0.1.0",
]

[project.optional-dependencies]
simulation = ["mujoco==4.0.1"]
voice = [
    "mlx-whisper>=0.4",
    "kokoro-onnx>=0.4",
    "soundfile>=0.12",
]

[project.scripts]
elrobot = "elrobot.cli:main"
elrobot-mcp = "elrobot.mcp_server:main"
so101-station = "so101_station.cli:main"
so101-cleanup = "so101_station.cleanup.cli:main"
so101-cleanup-mcp = "so101_station.cleanup.mcp_server:main"
station-robot-lab = "station_robotics.app:main"
station-cleanup = "station_robotics.cleanup_cli:main"
station-cleanup-mcp = "station_robotics.cleanup_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elrobot", "src/so101_station", "src/station_robotics"]
